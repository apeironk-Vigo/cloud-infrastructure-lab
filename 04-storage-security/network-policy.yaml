apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  # 1. Allow internal traffic between pods inside the monitoring namespace
  - from:
    - podSelector: {}
  # 2. Allow inbound traffic from Traefik ingress controller in kube-system
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system