server {
    listen 80;
    server_name vigo-caribou-01.local localhost;

    location / {
        default_type text/html;
        return 200 '<html><body><h1>Vigo Caribou Lab - Ingress Active</h1><p>Pillar 1 Nginx Reverse Proxy is functional.</p></body></html>';
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }
}